<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Footage Summary · NOMAD Video Campaigns</title><link rel="stylesheet" href="../app/globals.css?v=16"></head>
<body class="catalog-page" data-catalog-mode="footage"><main class="catalog-shell">
  <header class="catalog-header"><a class="catalog-back" href="./index.html">← Campaign library</a><div><span class="section-label">PRODUCTION OVERVIEW</span><h1>Complete footage summary</h1><p>Every planned scene across the campaign, connected to its storyboard, location, and actors.</p></div></header>
